[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ready-bench"
version = "0.1.0"
description = "AI-Ready Document Conversion Benchmark Suite & Community Leaderboard across Office, PDF, and Image formats"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "sun-flat-yamada", email = "engineering@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "tiktoken>=0.7.0",
    "markdown-it-py>=3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pypdf>=4.0.0",
]

[project.urls]
Homepage = "https://sun-flat-yamada.github.io/ai-ready-bench/"
Repository = "https://github.com/sun-flat-yamada/ai-ready-bench"
Documentation = "https://github.com/sun-flat-yamada/ai-ready-bench/tree/main/docs"
Issues = "https://github.com/sun-flat-yamada/ai-ready-bench/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
aiready = "aiready.cli:app"
ai-ready-bench = "aiready.cli:app"
doc-ai-bench = "aiready.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aiready"]
