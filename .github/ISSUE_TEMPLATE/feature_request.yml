name: Feature Request
description: Suggest an idea or new document format for ai-ready-bench
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We appreciate suggestions for expanding parser coverage and metrics!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new format/metric you'd like to see.
    validations:
      required: true
