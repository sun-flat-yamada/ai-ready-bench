name: Bug Report
description: Report a bug, crash, or calculation discrepancy in ai-ready-bench
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands and inputs to reproduce the behavior.
      placeholder: |
        1. Run `aiready run --dataset ...`
        2. Inspect output
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Execution Environment
      description: OS, Python version, hardware specs.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04
        - Python: 3.10.11
    validations:
      required: true
