name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Run Pytest Test Suite
      run: |
        uv run pytest -v --cov=aiready

    - name: Test CLI Suite Execution
      run: |
        uv run aiready generate-dataset --output-dir ./test-dataset
        uv run aiready run --dataset ./test-dataset --converter reference --work-dir ./test-runs --output-json ./test-runs/result.json
